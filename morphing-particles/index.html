<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphing Particles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #canvas-container canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
    .controls button { padding: 10px 24px; border: 1px solid #ddd; border-radius: 999px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .controls button:hover, .controls button.active { background: #111; color: #fff; border-color: #111; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="controls">
    <button data-index="0" class="active">Star</button>
    <button data-index="1">Heart</button>
    <button data-index="2">Bolt</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
